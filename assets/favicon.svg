<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 外框漸層 (硃砂紅/胡桃木) -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e2a2b" />
      <stop offset="50%" stop-color="#7c1d1d" />
      <stop offset="100%" stop-color="#541313" />
    </linearGradient>

    <!-- 算珠漸層 (琥珀金/黃金算珠) -->
    <linearGradient id="beadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- 算珠高光 -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 算檔金屬桿漸層 -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#6b7280" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="beadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 主外框 (帶圓角與立體陰影) -->
  <rect x="32" y="48" width="448" height="416" rx="40" fill="url(#frameGrad)" filter="url(#shadow)" stroke="#3f0e0e" stroke-width="6" />

  <!-- 內底盤 (象牙白/試卷紙底色) -->
  <rect x="56" y="72" width="400" height="368" rx="20" fill="#fbf8f1" />

  <!-- 五根算檔 (金屬桿) -->
  <!-- 檔 1 (x=104), 檔 2 (x=180), 檔 3 (x=256), 檔 4 (x=332), 檔 5 (x=408) -->
  <rect x="99" y="80" width="10" height="352" rx="4" fill="url(#rodGrad)" />
  <rect x="175" y="80" width="10" height="352" rx="4" fill="url(#rodGrad)" />
  <rect x="251" y="80" width="10" height="352" rx="4" fill="url(#rodGrad)" />
  <rect x="327" y="80" width="10" height="352" rx="4" fill="url(#rodGrad)" />
  <rect x="403" y="80" width="10" height="352" rx="4" fill="url(#rodGrad)" />

  <!-- 橫梁 (分隔上珠與下珠) -->
  <rect x="48" y="184" width="416" height="24" rx="4" fill="url(#frameGrad)" stroke="#3f0e0e" stroke-width="2" />
  <!-- 橫梁上的定位點 (三朵星點/計數位點: 第2, 第3, 第4檔) -->
  <circle cx="180" cy="196" r="3.5" fill="#fef3c7" />
  <circle cx="256" cy="196" r="3.5" fill="#fef3c7" />
  <circle cx="332" cy="196" r="3.5" fill="#fef3c7" />

  <!-- 算珠樣板巨集說明：菱形圓角算珠，寬 52，高 26 -->
  <!-- ==================== 上珠 (五珠) ==================== -->
  <!-- 檔1: 上珠靠梁 (值 5) y=152 -->
  <g filter="url(#beadShadow)">
    <polygon points="104,150 130,163 104,176 78,163" fill="url(#beadGrad)" />
    <path d="M 86,161 Q 104,152 122,161" stroke="url(#highlightGrad)" stroke-width="2.5" fill="none" />
  </g>

  <!-- 檔2: 上珠靠頂 (值 0) y=92 -->
  <g filter="url(#beadShadow)">
    <polygon points="180,90 206,103 180,116 154,103" fill="url(#beadGrad)" />
    <path d="M 162,101 Q 180,92 198,101" stroke="url(#highlightGrad)" stroke-width="2.5" fill="none" />
  </g>

  <!-- 檔3: 上珠靠梁 (值 5) y=152 -->
  <g filter="url(#beadShadow)">
    <polygon points="256,150 282,163 256,176 230,163" fill="url(#beadGrad)" />
    <path d="M 238,161 Q 256,152 274,161" stroke="url(#highlightGrad)" stroke-width="2.5" fill="none" />
  </g>

  <!-- 檔4: 上珠靠梁 (值 5) y=152 -->
  <g filter="url(#beadShadow)">
    <polygon points="332,150 358,163 332,176 306,163" fill="url(#beadGrad)" />
    <path d="M 314,161 Q 332,152 350,161" stroke="url(#highlightGrad)" stroke-width="2.5" fill="none" />
  </g>

  <!-- 檔5: 上珠靠頂 (值 0) y=92 -->
  <g filter="url(#beadShadow)">
    <polygon points="408,90 434,103 408,116 382,103" fill="url(#beadGrad)" />
    <path d="M 390,101 Q 408,92 426,101" stroke="url(#highlightGrad)" stroke-width="2.5" fill="none" />
  </g>

  <!-- ==================== 下珠 (一珠, 4筆/檔) ==================== -->
  <!-- 檔1 (顯示值 8 -> 上珠5靠梁 + 下珠3顆靠梁: y=214, 244, 274; 1顆靠底: y=394) -->
  <g filter="url(#beadShadow)">
    <polygon points="104,214 130,227 104,240 78,227" fill="url(#beadGrad)" />
    <polygon points="104,244 130,257 104,270 78,257" fill="url(#beadGrad)" />
    <polygon points="104,274 130,287 104,300 78,287" fill="url(#beadGrad)" />
    <polygon points="104,394 130,407 104,420 78,407" fill="url(#beadGrad)" />
  </g>

  <!-- 檔2 (顯示值 2 -> 下珠2顆靠梁: y=214, 244; 2顆靠底: y=364, 394) -->
  <g filter="url(#beadShadow)">
    <polygon points="180,214 206,227 180,240 154,227" fill="url(#beadGrad)" />
    <polygon points="180,244 206,257 180,270 154,257" fill="url(#beadGrad)" />
    <polygon points="180,364 206,377 180,390 154,377" fill="url(#beadGrad)" />
    <polygon points="180,394 206,407 180,420 154,407" fill="url(#beadGrad)" />
  </g>

  <!-- 檔3 (顯示值 9 -> 上珠5靠梁 + 下珠4顆全靠梁: y=214, 244, 274, 304) -->
  <g filter="url(#beadShadow)">
    <polygon points="256,214 282,227 256,240 230,227" fill="url(#beadGrad)" />
    <polygon points="256,244 282,257 256,270 230,257" fill="url(#beadGrad)" />
    <polygon points="256,274 282,287 256,300 230,287" fill="url(#beadGrad)" />
    <polygon points="256,304 282,317 256,330 230,317" fill="url(#beadGrad)" />
  </g>

  <!-- 檔4 (顯示值 6 -> 上珠5靠梁 + 下珠1顆靠梁: y=214; 3顆靠底: y=334, 364, 394) -->
  <g filter="url(#beadShadow)">
    <polygon points="332,214 358,227 332,240 306,227" fill="url(#beadGrad)" />
    <polygon points="332,334 358,347 332,360 306,347" fill="url(#beadGrad)" />
    <polygon points="332,364 358,377 332,390 306,377" fill="url(#beadGrad)" />
    <polygon points="332,394 358,407 332,420 306,407" fill="url(#beadGrad)" />
  </g>

  <!-- 檔5 (顯示值 0 -> 4顆全靠底: y=304, 334, 364, 394) -->
  <g filter="url(#beadShadow)">
    <polygon points="408,304 434,317 408,330 382,317" fill="url(#beadGrad)" />
    <polygon points="408,334 434,347 408,360 382,347" fill="url(#beadGrad)" />
    <polygon points="408,364 434,377 408,390 382,377" fill="url(#beadGrad)" />
    <polygon points="408,394 434,407 408,420 382,407" fill="url(#beadGrad)" />
  </g>
</svg>
